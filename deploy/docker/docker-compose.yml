# docker-compose.yml — Despliegue de referencia para fab en contenedor con Caddy y mTLS (T118b)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # T118-P2-1: Montaje granular exclusivo de certificados públicos y clave de cliente (sin claves de CA)
      - ./certs/client.crt:/etc/caddy/certs/client.crt:ro
      - ./certs/client.key:/etc/caddy/certs/client.key:ro
      - ./certs/server-ca.crt:/etc/caddy/certs/server-ca.crt:ro
    networks:
      - fab-public
      - fab-internal

  fab-backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      - FAB_PUBLIC_ORIGIN=https://fab.ejemplo.com
      - FAB_SOCKET=
      - NODE_ENV=production
    volumes:
      # IMPORTANTE (D2N-H14): SQLite compartido con Docker exige montaje de disco local
      # bajo el mismo kernel, host coordinador y UID escritor (1000). Excluir volúmenes remotos.
      - fab_data:/var/lib/fab
      # T118-P2-1: Montaje granular exclusivo de certificado de servidor y CA de cliente (sin claves de CA)
      - ./certs/server.crt:/etc/fab/certs/server.crt:ro
      - ./certs/server.key:/etc/fab/certs/server.key:ro
      - ./certs/client-ca.crt:/etc/fab/certs/client-ca.crt:ro
    # NO expone puertos en la red del host; solo accesible vía red interna con mTLS
    expose:
      - "8443"
    networks:
      - fab-internal

networks:
  fab-public:
    driver: bridge # Red externa para Caddy (puertos públicos 80/443 y certificados ACME)
  fab-internal:
    internal: true # Sin acceso directo a internet para el backend; Caddy es el único borde

volumes:
  caddy_data:
  caddy_config:
  fab_data:
