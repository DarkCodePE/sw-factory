name: FAB protected release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: fab-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  github:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Admit a successful exact-SHA preflight and its sealed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/find-candidate.mjs
      - name: Publish only sealed bytes, then download and compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish-github.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-publication-${{ github.sha }}
          path: dist/github-publication.json
          if-no-files-found: error
  npm:
    needs: github
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download sealed npm artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/find-candidate.mjs --metadata-only
          node scripts/release/seal.mjs dist/candidate --verify --metadata-only
      - name: Publish the exact package with provenance (OIDC or bootstrap token)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release/publish-npm.mjs
  public-github:
    needs: github
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Linux installed Script sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install anonymously through the public shell installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/find-candidate.mjs --metadata-only
          node scripts/release/public-install.mjs --github-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-github-${{ matrix.runner }}-${{ github.sha }}
          path: dist/publication-github-*.json
          if-no-files-found: error
  public-npm:
    needs: npm
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Linux installed Script sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Verify public npm bytes and test a default installation from a fresh home
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/find-candidate.mjs --metadata-only
          node scripts/release/public-install.mjs --npm-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-npm-${{ matrix.runner }}-${{ github.sha }}
          path: dist/publication-npm-*.json
          if-no-files-found: error
